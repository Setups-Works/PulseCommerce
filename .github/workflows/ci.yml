name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Vercel reports each deployment here, which is what lets the smoke job run
  # against the URL it actually published.
  deployment_status:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The SDK builds first — the CLI's own typecheck resolves its types
      # from packages/sdk/dist, the same way a real consumer installing both
      # from npm would.
      - name: Build SDK
        run: npm run build -w packages/sdk

      - name: Typecheck CLI
        run: npm run typecheck -w packages/cli

      - name: Build CLI
        run: npm run build -w packages/cli

      - name: CLI smoke
        run: node packages/cli/dist/index.js --help

  test:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Only the browser the suite actually uses.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite builds and starts the app itself, deliberately with no store
      # and no gateway configured — the state a fresh clone is in.
      - name: Run tests
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The OpenAPI document is written by hand, so it can drift from the
      # routes. This fails when a route exists that nobody documented.
      # README diagrams are checked by the end-to-end suite, which parses them
      # in a real browser with the library GitHub renders with.
      - name: Check API docs cover every route
        run: node scripts/check-openapi.mjs

  # ---------------------------------------------------------------------------
  # Deployment is Vercel's, triggered by the push rather than by this workflow.
  # What is missing without this job is any check that what Vercel published
  # actually serves — so this runs the smoke tests against the deployment URL
  # once Vercel reports it ready.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test the deployment
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke test
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npx playwright test --project=smoke
